name: "CodeQL Analysis"

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze C/C++
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc make bison flex \
          libssl-dev libgnutls28-dev \
          bc python3 python3-dev \
          swig device-tree-compiler

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: c-cpp
        build-mode: manual        # <-- AGGIUNTO: obbligatorio in v4
        config-file: ./.github/codeql/codeql-config.yml

    # Con build-mode: manual, il build va DOPO init
    - name: Build U-Boot
      run: |
        make sandbox_defconfig
        make -j$(nproc) 2>&1 | tail -50   # mostra gli ultimi 50 log se fallisce

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:c-cpp"