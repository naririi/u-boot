name: "CodeQL Analysis"

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze C/C++
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc make bison flex \
          libssl-dev libgnutls28-dev \
          bc python3 python3-dev \
          swig device-tree-compiler \
          libfdt-dev uuid-dev pkg-config

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: c-cpp
        build-mode: manual
        # query referenziata direttamente, senza config-file separato
        queries: ./.github/codeql/custom-queries/taint_tracking.ql

    - name: Build U-Boot
      run: |
        make sandbox_defconfig
        # -k: continua anche se alcuni file falliscono
        make -j$(nproc) -k 2>&1 | tail -50 || true
      # continua anche se il build non è perfetto
      continue-on-error: true

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:c-cpp"